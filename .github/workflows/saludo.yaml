name: saludando

on:
  push:
    branches:
    - main
    - develop

env:
  NOMBRE: "Bryan Gabriel Ruiz Tulumba"

jobs:
  saludo:
    runs-on: ubuntu-latest
    steps:
      - name: Saludo desde main
        if: github.ref == 'refs/heads/main'
        run: echo "Hola desde main, soy $NOMBRE"
      - name: Saludo desde develop
        if: github.ref == 'refs/heads/develop'
        run: echo "Hola desde develop, soy $NOMBRE"
